services:
  - type: web
    name: calorie-compass-backend
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app app:create_app db upgrade && gunicorn --bind 0.0.0.0:$PORT "app:create_app()"
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: calorie-compass-db
          property: connectionString

  - type: web
    name: calorie-compass-web
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run start -w bff
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        fromService:
          type: web
          name: calorie-compass-backend
          property: hostport

databases:
  - name: calorie-compass-db
    plan: free
    region: frankfurt
    databaseName: calorie_compass
    user: calorie_compass
    ipAllowList: []
